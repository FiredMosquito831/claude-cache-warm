name: CI

on:
  push:
    branches: [main, revamp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  site:
    name: Site build is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-site.txt
      - name: Verify docs/ matches a fresh build
        run: python scripts/build_site.py --check
      - name: Check required generated files
        run: |
          test -s docs/index.html
          test -s docs/reference/index.html
          test -s docs/dashboard/index.html
          test -s docs/faq/index.html
          test -s docs/security/index.html
          test -s docs/og.png
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          test -s docs/CNAME
          test -f docs/.nojekyll
