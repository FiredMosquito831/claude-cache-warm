<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Cache Warm</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #16130f; color: #efe7dc;
    }
    @media (prefers-color-scheme: light) { body { background: #faf6f0; color: #2a2118; } }
    main { text-align: center; padding: 24px; max-width: 460px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 18px;
      background: #f07a12; animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0; opacity: .7; }
    code { font-family: Consolas, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Starting the dashboard&hellip;</h1>
    <p id="status">Waiting for the local server.</p>
  </main>
  <script src="main.js"></script>
</body>
</html>
