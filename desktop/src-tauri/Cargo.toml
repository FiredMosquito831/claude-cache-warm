[package]
name = "claude-cache-warm"
version = "0.1.0"
description = "Tray app for Claude Cache Warm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_cache_warm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
